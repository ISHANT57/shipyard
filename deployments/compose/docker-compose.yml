# Local development stack. Credentials here are throwaway defaults for a
# database that only ever exists on your own machine — not real secrets,
# so they're safe to commit (see docs/operations/free-local-stack.md,
# added in Phase 09, for the full local-stack story).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    ports:
      # Host port 5433, not 5432: on a dev machine already running another
      # Postgres on the default port, colliding silently connects your
      # tooling to the wrong database instead of failing loudly.
      - "5433:5432"
    volumes:
      - shipyard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready lets `docker compose up --wait` and CI know the
      # database can actually accept connections, not just that the
      # container process has started.
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  shipyard-postgres-data:
