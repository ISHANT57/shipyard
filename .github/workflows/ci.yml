name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test (race detector, coverage)
        run: go test ./... -race -cover

      - name: Build
        run: go build ./...

      - name: Build Docker image
        run: docker build -t shipyard-api:ci -f cmd/shipyard-api/Dockerfile .

      - name: Build worker Docker image
        run: docker build -t shipyard-worker:ci -f cmd/shipyard-worker/Dockerfile .
